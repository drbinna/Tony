<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https://api.anam.ai https://*.anam.ai wss://*.anam.ai https://lab.anam.ai stun: turn: turns:">
<title>Tony</title>
<style>
  /* ── tokens ────────────────────────────────────────────────────────────
     Goblin green against a near-black with a green cast. AWS orange is
     RESERVED — it appears only when Tony has the wheel, so the one moment
     the app can act on your console is the one moment it changes colour. */
  :root {
    --void:    #0B0F0E;
    --shell:   #131A18;
    --goblin:  #3FD07A;
    --ember:   #FF8A3D;
    --slate:   #7A8B85;
    --bone:    #E8EDEA;

    --ring: var(--slate);
    --ring-w: 2px;
    --glow: transparent;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: transparent;
    font-family: var(--sans);
    color: var(--bone);
    overflow: hidden;
    user-select: none;
    cursor: default;
  }

  /* No card chrome anymore: the app is a floating circle plus small bubbles. */
  #card {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px 6px;
  }

  /* ── the avatar circle: the state ring IS its border ─────────────────── */
  #stage {
    position: relative;
    width: 148px; height: 148px;
    flex: none;
    border-radius: 50%;
    overflow: hidden;
    background: var(--void);
    border: var(--ring-w) solid var(--ring);
    box-shadow: 0 14px 36px rgba(0,0,0,.5), 0 0 0 6px var(--glow);
    transition: border-color .18s ease, box-shadow .18s ease;
    /* The circle is the drag handle — there are no child controls left to
       swallow clicks in this frameless transparent window. */
    -webkit-app-region: drag;
  }
  #stage video { width: 100%; height: 100%; object-fit: cover; display: block; }

  #scan {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, rgba(63,208,122,.10) 50%, transparent 100%);
    opacity: 0; transition: opacity .2s ease;
  }
  body[data-state="thinking"] #scan { opacity: 1; animation: sweep 1.4s linear infinite; }
  @keyframes sweep { from { transform: translateY(-100%); } to { transform: translateY(100%); } }

  /* ── status pill: an instrument, so it's set in mono ─────────────────── */
  #status {
    display: flex; align-items: center; gap: 7px;
    max-width: 100%;
    padding: 5px 12px;
    background: var(--shell);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--slate);
    white-space: nowrap;
    -webkit-app-region: drag;
  }
  #dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ring); flex: none; }
  body[data-state="observing"] #dot { animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  #detail { color: rgba(232,237,234,.4); text-transform: none; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; }
  #detail:empty { display: none; }
  #detail[data-net="weak"] { color: var(--ember); }
  /* mic state is a promise the UI makes; it must be readable at a glance */
  #mic { color: rgba(232,237,234,.35); }
  #mic[data-live="true"] { color: var(--ember); font-weight: 700; }

  /* ── speech bubble: present only when Tony has something to say ──────── */
  #speech {
    width: 100%;
    padding: 9px 12px;
    background: var(--shell);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    font-size: 12px; line-height: 1.45;
    max-height: 108px; overflow-y: auto;
    color: var(--bone);
  }
  #speech:empty {
    background: transparent; border-color: transparent;
    text-align: center; padding: 2px;
  }
  #speech:empty::after {
    content: "^⌥Space to ask"; color: rgba(232,237,234,.25); font-size: 10px;
    font-family: var(--mono); letter-spacing: .06em;
  }
  body[data-ask-key] #speech:empty::after { content: attr(data-ask-key) " to ask"; }
  #speech .bridge { color: var(--slate); font-style: italic; }

  /* ── driving: the one loud moment ────────────────────────────────────── */
  body[data-state="driving"] {
    --ring: var(--ember); --ring-w: 3px; --glow: rgba(255,138,61,.16);
  }
  #wheel {
    display: none;
    width: 100%;
    padding: 6px 10px; background: var(--ember); color: #1A0D00;
    border-radius: 999px;
    font-family: var(--mono); font-size: 9px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; text-align: center;
  }
  body[data-state="driving"] #wheel { display: block; }

  body[data-state="observing"] { --ring: rgba(63,208,122,.45); }
  body[data-state="speaking"]  { --ring: var(--goblin); --glow: rgba(63,208,122,.10); }
  body[data-state="idle"]      { --ring: rgba(255,255,255,.08); }
  body[data-state="paused"]    { --ring: rgba(255,255,255,.14); }

  /* ── filebox: the Terraform hand-off, downloadable the moment it exists ── */
  #filebox {
    display: none; width: 100%;
    align-items: center; gap: 8px;
    padding: 7px 10px;
    background: var(--shell);
    border: 1px solid rgba(63,208,122,.28);
    border-radius: 10px;
    font-size: 11px; color: var(--bone);
    -webkit-app-region: no-drag; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  #filebox.show { display: flex; }
  #filebox:hover { border-color: var(--goblin); background: #172420; }
  #filebox .fb-icon { font-size: 14px; flex: none; }
  #filebox .fb-text { flex: 1; min-width: 0; line-height: 1.25; }
  #filebox .fb-title { font-weight: 600; }
  #filebox .fb-sub {
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .04em;
    color: var(--slate); text-transform: uppercase;
  }
  #filebox .fb-action {
    flex: none; font-family: var(--mono); font-size: 9px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--goblin);
  }
  #filebox[data-busy="true"] { pointer-events: none; opacity: .7; }
  #filebox[data-busy="true"] .fb-action { color: var(--slate); }

  /* ── close/exit: end the session and quit ────────────────────────────────
     The window is frameless (no OS close button), so this is the only way out.
     It sits over the top-right of the avatar circle, no-drag so it's clickable,
     and stays faintly visible always — users reported having no way to close. */
  #close {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(11,15,14,.72);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 50%;
    color: rgba(232,237,234,.55);
    font-family: var(--sans); font-size: 14px; line-height: 1;
    cursor: pointer; z-index: 10;
    opacity: .5;
    transition: opacity .15s ease, color .15s ease, border-color .15s ease, background .15s ease;
    -webkit-app-region: no-drag;
  }
  #close:hover {
    opacity: 1; color: var(--bone);
    border-color: var(--ember); background: rgba(20,14,8,.92);
  }

  /* ── blocking notice ─────────────────────────────────────────────────── */
  #notice {
    display: none; width: 100%; padding: 10px 12px;
    background: rgba(20,14,8,.96);
    border: 1px solid rgba(255,138,61,.35); border-radius: 12px;
    font-size: 11.5px; line-height: 1.4;
    -webkit-app-region: no-drag;
  }
  #notice.show { display: block; }
  #notice a { color: var(--ember); cursor: pointer; text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    #scan, #dot { animation: none !important; }
    #stage { transition: none; }
  }
</style>
</head>
<body data-state="idle">
  <div id="card">
    <button id="close" type="button" title="End session and quit Tony" aria-label="End session and quit Tony">×</button>
    <div id="stage">
      <video id="persona" autoplay playsinline></video>
      <!-- The SDK's streamToVideoElement attaches the VIDEO track to the video
           element but only EMITS the audio track via AUDIO_STREAM_STARTED --
           it never plays it. We attach it to this sink ourselves. Verified by
           reading StreamingClient.onTrackEventHandler in the installed SDK. -->
      <audio id="persona-audio" autoplay></audio>
      <div id="scan"></div>
    </div>

    <div id="wheel">Tony has the wheel — any key stops</div>

    <div id="status">
      <span id="dot"></span>
      <span id="label">Dormant</span>
      <span id="mic">mic off</span>
      <span id="detail"></span>
    </div>

    <div id="speech"></div>

    <div id="filebox" title="Save the Terraform + README to your Downloads">
      <span class="fb-icon">📦</span>
      <span class="fb-text">
        <span class="fb-title">lesson.zip</span>
        <span class="fb-sub" id="fb-sub">Terraform ready</span>
      </span>
      <span class="fb-action" id="fb-action">Download</span>
    </div>

    <div id="notice"></div>
  </div>

  <!-- bundle.js is generated by `npm run build:renderer` (esbuild).
       The renderer is a pure browser context (contextIsolation: true,
       nodeIntegration: false) so it cannot resolve bare specifiers like
       "@anam-ai/js-sdk", nor the SDK's extensionless internal imports.
       Loading renderer.js directly fails silently: no listeners attach,
       connect() never runs, and the card sits on its hardcoded defaults. -->
  <script type="module" src="./bundle.js"></script>
</body>
</html>
