name: Release macOS DMG

# Build, sign, notarize and publish the installer on a version tag (e.g. v0.1.1).
# Uploads both arch DMGs to Vercel Blob under STABLE keys (Tony-arm64.dmg /
# Tony-x64.dmg) that the landing page's /downloads redirects resolve to, then
# points the site links at those stable names (idempotent; a no-op after the
# first release). Notarization takes ~10-15 min.
#
# Required repository secrets:
#   CSC_LINK                     base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD             password for that .p12
#   APPLE_ID                     Apple ID email for notarytool
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID                8938U82HGG
#   BLOB_READ_WRITE_TOKEN        Vercel Blob read-write token
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # package-lock.json is gitignored in this repo, so use install (not ci,
      # which requires a committed lockfile) and skip the lockfile-hashed cache.
      - run: npm install

      # --publish always uploads the DMGs, the auto-update .zip, and the
      # latest-mac.yml manifest to a GitHub Release for this tag (public repo →
      # electron-updater in the installed app reads them without auth). The
      # website still serves DMGs from Vercel Blob (step below); GitHub Releases
      # is only the auto-update feed. The .app inside the .zip is notarized +
      # stapled by electron-builder, so Squirrel accepts the update.
      - name: Build, sign, notarize & publish (GitHub Releases feed)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --mac -c.mac.notarize=true --publish always

      # Fail before the release goes public if either .app has the wrong arch
      # (native-only Swift fallback, or a mis-targeted Electron). A bad build
      # then stays a draft — the un-draft step below never runs.
      - name: Verify architectures (arm64 + x64 must be correct)
        run: bash build/verify-arch.sh

      # electron-builder publishes the feed as a DRAFT (and its multi-arch race
      # can leave a stray duplicate). Un-draft the complete one so
      # electron-updater can actually see it. Tag pushes only.
      - name: Publish the GitHub Release (un-draft + dedupe auto-update feed)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node build/publish-release.mjs

      # electron-builder notarizes the .app (stapled inside the DMG) but not the
      # DMG container, so stapling the .dmg with only the app's ticket fails
      # ("Record not found"). Notarize each DMG here, then staple it, so the
      # distributable validates offline on first launch.
      - name: Notarize & staple the DMG containers
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for d in dist/*.dmg; do
            echo "Notarizing $d"
            xcrun notarytool submit "$d" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$d"
          done

      - name: Upload DMGs to Vercel Blob (stable keys)
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          node build/upload-blob.mjs "$(ls dist/*arm64.dmg | head -1)" Tony-arm64.dmg
          node build/upload-blob.mjs "$(ls dist/*x64.dmg | head -1)" Tony-x64.dmg

      - name: Point site downloads at the stable URLs
        run: node build/normalize-site-links.mjs

      - name: Commit site link normalization if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- site/; then
            echo 'site links already stable'
          else
            git add site/index.html site/vercel.json
            git commit -m 'CI: point downloads at stable release URLs [skip ci]'
            # main can advance during the ~8-min notarize (a concurrent push),
            # so rebase onto the latest before pushing, and retry the race.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "pushed on attempt $attempt"; break
              fi
              echo "push rejected (attempt $attempt); rebasing on origin/main"
              git fetch origin main
              git rebase origin/main
            done
          fi
